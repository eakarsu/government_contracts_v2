services:
  postgres:
    image: postgres:15
    container_name: contract_postgres
    environment:
      POSTGRES_DB: contract_db
      POSTGRES_USER: contract_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contract_user -d contract_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Main Node.js API server with a persistent local vector index
  api:
    build: .
    container_name: contract_api
    environment:
      DATABASE_URL: postgresql://contract_user:${POSTGRES_PASSWORD}@postgres:5432/contract_db
      NODE_ENV: production
      PORT: 3000
      API_BASE_URL: http://localhost:3000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SAM_GOV_API_KEY: ${SAM_GOV_API_KEY:-}
      NORSHIN_API_KEY: ${NORSHIN_API_KEY:-}
      NORSHIN_API_URL: ${NORSHIN_API_URL:-https://norshin.com/api/process-document}
      AUTH_MODE: ${AUTH_MODE:-oidc}
      OIDC_ISSUER: ${OIDC_ISSUER:?OIDC_ISSUER is required}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?OIDC_AUDIENCE is required}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:?OIDC_JWKS_URI is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
      - ./documents:/app/documents
      - ./queue_documents:/app/queue_documents
      - ./processed_queue_documents:/app/processed_queue_documents
      - ./downloaded_documents:/app/downloaded_documents
      - ./temp_downloads:/app/temp_downloads
      - ./temp_conversions:/app/temp_conversions
      - ./vector_indexes:/app/vector_indexes
      - ./temp_images:/app/temp_images
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

  migrate:
    build: .
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://contract_user:${POSTGRES_PASSWORD}@postgres:5432/contract_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
