version: '3.8'

services:
  government_contracts:
    image: eakarsun4/government_contracts:latest
    container_name: government_contracts
    restart: unless-stopped
    env_file:
      - .env.gov
    ports:
      - "5013:5013"
    volumes:
      # Persistent data volumes
      - gov_vector_indexes:/app/vector_indexes
      - gov_uploads:/app/uploads
      - gov_documents:/app/documents
      - gov_pgdata:/var/lib/postgresql/data
      - gov_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5013/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gov_vector_indexes:
  gov_uploads:
  gov_documents:
  gov_pgdata:
  gov_logs:
