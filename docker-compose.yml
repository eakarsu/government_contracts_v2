x-app-environment: &app-environment
  DATABASE_URL: postgresql://contract_user:${POSTGRES_PASSWORD}@postgres:5432/contract_db
  NODE_ENV: production
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-haiku-4.5}
  SAM_GOV_API_KEY: ${SAM_GOV_API_KEY:-}
  NORSHIN_API_KEY: ${NORSHIN_API_KEY:-}
  NORSHIN_API_URL: ${NORSHIN_API_URL:-https://norshin.com/api/process-document}
  AUTH_MODE: oidc
  OIDC_ISSUER: ${OIDC_ISSUER:?OIDC_ISSUER is required}
  OIDC_AUDIENCE: ${OIDC_AUDIENCE:?OIDC_AUDIENCE is required}
  OIDC_JWKS_URI: ${OIDC_JWKS_URI:?OIDC_JWKS_URI is required}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?OIDC_CLIENT_ID is required}
  OIDC_AUTHORIZATION_ENDPOINT: ${OIDC_AUTHORIZATION_ENDPOINT:?OIDC_AUTHORIZATION_ENDPOINT is required}
  OIDC_TOKEN_ENDPOINT: ${OIDC_TOKEN_ENDPOINT:?OIDC_TOKEN_ENDPOINT is required}
  OIDC_TENANT_CLAIM: ${OIDC_TENANT_CLAIM:-tenant_id}
  TENANT_ENFORCEMENT: required
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
  ENABLE_TEST_ENDPOINTS: "false"
  PIPELINE_EXECUTION_MODE: durable
  DOCUMENT_STORAGE_PROVIDER: s3
  MALWARE_SCAN_MODE: required
  S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
  S3_KMS_KEY_ID: ${S3_KMS_KEY_ID:-}
  S3_RETENTION_DAYS: ${S3_RETENTION_DAYS:-90}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY is required}
  SMTP_URL: ${SMTP_URL:-}
  NOTIFICATION_FROM: ${NOTIFICATION_FROM:-}
  MONITORING_TOKEN: ${MONITORING_TOKEN:?MONITORING_TOKEN is required}
  SENTRY_DSN: ${SENTRY_DSN:-}
  FEATURE_SPORTS_CONTRACTS: ${FEATURE_SPORTS_CONTRACTS:-false}
  FEATURE_SMART_CONTRACT_ASSURANCE: ${FEATURE_SMART_CONTRACT_ASSURANCE:-false}
  SUBMISSION_PACKAGE_ENFORCEMENT: required

services:
  postgres:
    image: postgres:15
    container_name: contract_postgres
    environment:
      POSTGRES_DB: contract_db
      POSTGRES_USER: contract_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contract_user -d contract_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Main Node.js API server with a persistent local vector index
  api:
    build: .
    container_name: contract_api
    environment:
      <<: *app-environment
      PORT: 3000
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
      - ./documents:/app/documents
      - ./queue_documents:/app/queue_documents
      - ./processed_queue_documents:/app/processed_queue_documents
      - ./downloaded_documents:/app/downloaded_documents
      - ./temp_downloads:/app/temp_downloads
      - ./temp_conversions:/app/temp_conversions
      - ./vector_indexes:/app/vector_indexes
      - ./temp_images:/app/temp_images
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

  worker:
    build: .
    command: ["npm", "run", "worker"]
    environment:
      <<: *app-environment
    volumes:
      - ./uploads:/app/uploads
      - ./documents:/app/documents
      - ./queue_documents:/app/queue_documents
      - ./processed_queue_documents:/app/processed_queue_documents
      - ./downloaded_documents:/app/downloaded_documents
      - ./temp_downloads:/app/temp_downloads
      - ./temp_conversions:/app/temp_conversions
      - ./vector_indexes:/app/vector_indexes
      - ./temp_images:/app/temp_images
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - app-network

  backup:
    build: .
    command: ["bash", "/app/scripts/scheduled-backup.sh"]
    environment:
      DATABASE_URL: postgresql://contract_user:${POSTGRES_PASSWORD}@postgres:5432/contract_db
      BACKUP_DIRECTORY: /backups
      BACKUP_ENCRYPTION_KEY_FILE: /run/secrets/backup_encryption_key
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RESTORE_TEST_ENABLED: ${BACKUP_RESTORE_TEST_ENABLED:-true}
      RESTORE_TEST_DATABASE_URL: ${RESTORE_TEST_DATABASE_URL:-}
    volumes:
      - ${BACKUP_HOST_DIRECTORY:?BACKUP_HOST_DIRECTORY is required}:/backups
      - ${BACKUP_ENCRYPTION_KEY_HOST_FILE:?BACKUP_ENCRYPTION_KEY_HOST_FILE is required}:/run/secrets/backup_encryption_key:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - app-network

  migrate:
    build: .
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://contract_user:${POSTGRES_PASSWORD}@postgres:5432/contract_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
